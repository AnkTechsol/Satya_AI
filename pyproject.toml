[project]
name = "satya-ai"
version = "0.2.0"
description = "Zero-infra semantic health and goal alignment task tracker for AI agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Anktechsol Team", email = "info@anktechsol.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "beautifulsoup4>=4.12.0",
    "gitpython>=3.1.40",
    "markdownify>=0.11.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "streamlit>=1.30.0",
    "nltk>=3.8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

