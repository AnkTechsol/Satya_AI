name: Auto-README updater

on:
  push:
    branches:
      - main

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system pytest pytest-cov pytest-asyncio requests pandas gitpython beautifulsoup4 markdownify streamlit psycopg2-binary boto3
      - name: Generate Analytics
        run: python generate_analytics.py
      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add REPO_ANALYTICS.md repo_analytics.json README.md
          git commit -m "chore: auto-update readme and analytics" || echo "No changes to commit"
          git push