name: Auto-README Updater

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'

jobs:
  update-analytics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure explicit git permissions
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -r requirements.txt || true
          uv pip install --system pytest pytest-cov requests pandas gitpython

      - name: Run Analytics
        env:
          AUDIT_SECRET: dummy_secret
          SATYA_AGENT_KEY: DEMO_KEY
          SATYA_AGENT_KEYS: DEMO_KEY
          PYTHONPATH: .
        run: |
          python generate_analytics.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add repo_analytics.json REPO_ANALYTICS.md README.md
          git commit -m "chore: auto-update analytics and README [skip ci]" || echo "No changes to commit"
          git push origin main
